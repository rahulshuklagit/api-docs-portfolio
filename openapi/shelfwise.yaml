openapi: 3.0.3

info:
  title: Shelfwise Library API
  version: 1.0.0
  description: |
    The Shelfwise Library API lets you search a library catalogue and
    manage book reservations for library members.

    This is a fictional API, created as a documentation portfolio sample.
  contact:
    name: Rahul Shukla
    url: https://github.com/rahulshuklagit/api-docs-portfolio
  
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.shelfwise.example.com/v1
    description: Production

security:
  - ApiKeyAuth: []

tags:
  - name: Books
    description: Search and view books in the catalogue.
  - name: Reservations
    description: Reserve books and manage existing reservations.

paths:
  /books:
    get:
      operationId: listBooks
      summary: List books
      description: >
        Returns a paginated list of books in the catalogue. Use the query
        parameters to search by text, filter by author, or show only books
        that are available to reserve.
      tags:
        - Books
      parameters:
        - name: q
          in: query
          description: Text to search for in book titles and authors. Not case-sensitive.
          schema:
            type: string
          example: pragmatic
        - name: author
          in: query
          description: Return only books by this author. Must match exactly.
          schema:
            type: string
          example: David Thomas, Andrew Hunt
        - name: available
          in: query
          description: Set to `true` to return only books that can be reserved now.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of books that match the filters.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Your API key. Send it in the `X-API-Key` header with every request.
  schemas:
    Book:
      type: object
      description: A book in the library catalogue.
      required:
        - id
        - title
        - author
        - isbn
        - available
      properties:
        id:
          type: string
          description: Unique identifier for the book.
          example: bk_7f3a9c
        title:
          type: string
          description: Title of the book.
          example: The Pragmatic Programmer
        author:
          type: string
          description: Author or authors of the book.
          example: David Thomas, Andrew Hunt
        isbn:
          type: string
          description: 13-digit ISBN, without hyphens.
          pattern: '^97[89][0-9]{10}$'
          example: '9780135957059'
        publishedYear:
          type: integer
          description: Year this edition was published.
          example: 2019
        available:
          type: boolean
          description: Whether the book can be reserved right now.
          example: true

    Pagination:
      type: object
      description: Paging details returned with every list response.
      required:
        - page
        - limit
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number.
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of items per page.
          example: 20
        totalItems:
          type: integer
          description: Total number of items across all pages.
          example: 42
        totalPages:
          type: integer
          description: Total number of pages.
          example: 3

    Error:
      type: object
      description: Standard error response returned by every endpoint.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code. Use this in your code, not the message.
          example: BOOK_NOT_FOUND
        message:
          type: string
          description: Human-readable explanation of the error.
          example: No book exists with the ID bk_0000.
        details:
          type: array
          description: Field-level problems. Returned only for validation errors (400).
          items:
            type: object
            properties:
              field:
                type: string
                example: limit
              issue:
                type: string
                example: Must be between 1 and 100.
  parameters:
    Page:
      name: page
      in: query
      description: Page number to return. Starts at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request has invalid parameters or an invalid body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: One or more parameters are invalid.
            details:
              - field: limit
                issue: Must be between 1 and 100.
    Unauthorized:
      description: The API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Provide a valid API key in the X-API-Key header.
    TooManyRequests:
      description: You sent too many requests. Wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Rate limit exceeded. Try again in 60 seconds.